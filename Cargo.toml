[package]
name = "google-news-url-decoder"
version = "0.2.1"
edition = "2021"
description = "Decode Google News article share URLs to their original article URL."
license = "MIT"
repository = "https://github.com/daeuk1011/google-news-url-decoder-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
