name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the NPM_TOKEN behind a GitHub Environment. Configure required reviewers
    # (and optionally a wait timer) on the `release` environment in repo settings so
    # the token is only released after manual approval. Until configured this is a no-op.
    environment: release
    steps:
      # fetch-depth: 0 so the branch-ancestry check below can see full history.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack (pinned, from crates.io)
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify tag matches package.json version
        run: |
          # GITHUB_REF_NAME is a trusted, runner-provided env var (the pushed tag).
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from origin/main — refusing to publish"
            exit 1
          fi

      - name: Lint and unit test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build wasm (both targets)
        run: |
          wasm-pack build --target bundler --release --out-dir pkg
          wasm-pack build --target nodejs --release --out-dir pkg-node

      - name: Integration tests
        run: npm run test:int

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
